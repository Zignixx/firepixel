# macOS preview: Firepixel.app as a universal binary (arm64 + x86_64) in a ZIP artifact, optionally
# plus tests of the platform-neutral, batch and export crates. No push trigger: manual only (workflow_dispatch) or from
# the release workflow (workflow_call), because macOS minutes count ten times.
name: macos-preview

on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Also run the tests of the platform-neutral, batch and export crates (approx. 20-25 macOS minutes, estimate)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: "Commit or branch to build"
        type: string
        required: true

concurrency:
  group: macos-preview-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Preview: build faster than the Windows release (thin LTO stays)
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
  # Minimum macOS for both architectures of the universal build (Intel Macs from Catalina on)
  MACOSX_DEPLOYMENT_TARGET: "10.15"

jobs:
  bundle:
    name: Firepixel.app (universal)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          rustc --version

      # nasm: only needed if the AV1 encoder crate builds its x86 assembly for the x86_64 target;
      # harmless otherwise.
      - name: Install nasm
        run: brew install nasm

      - uses: Swatinem/rust-cache@v2.8.0
        with:
          shared-key: macos-universal
          cache-on-failure: true

      - name: Release build arm64 (GUI + CLI)
        run: cargo build --release --locked --target aarch64-apple-darwin -p firepixel -p firepixel-cli

      - name: Release build x86_64 (GUI + CLI)
        run: cargo build --release --locked --target x86_64-apple-darwin -p firepixel -p firepixel-cli

      - name: Merge universal binaries (lipo)
        run: |
          set -euo pipefail
          mkdir -p target/universal
          for BIN in firepixel firepixel-cli; do
            lipo -create               "target/aarch64-apple-darwin/release/$BIN"               "target/x86_64-apple-darwin/release/$BIN"               -output "target/universal/$BIN"
          done

      - name: Verify universal binaries
        run: |
          set -euo pipefail
          for BIN in target/universal/firepixel target/universal/firepixel-cli; do
            lipo -info "$BIN"
            file "$BIN"
            ARCHS=$(lipo -archs "$BIN")
            for ARCH in arm64 x86_64; do
              case " $ARCHS " in
                *" $ARCH "*) ;;
                *) echo "::error::$BIN lacks architecture $ARCH (has: $ARCHS)"; exit 1 ;;
              esac
            done
          done

      - name: Create app bundle
        run: |
          set -euo pipefail
          VERSION=$(cargo pkgid -p firepixel | sed -E 's/.*[#@]//')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          OUT=dist/Firepixel-macOS-universal
          APP=$OUT/Firepixel.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/universal/firepixel "$APP/Contents/MacOS/firepixel"
          cp target/universal/firepixel-cli "$OUT/firepixel-cli"

          # Icon: existing PNGs (16-256 px), larger sizes upscaled
          ICONSET=$(mktemp -d)/Firepixel.iconset
          mkdir -p "$ICONSET"
          P=assets/icon/png
          cp $P/firepixel_16.png  "$ICONSET/icon_16x16.png"
          cp $P/firepixel_32.png  "$ICONSET/icon_16x16@2x.png"
          cp $P/firepixel_32.png  "$ICONSET/icon_32x32.png"
          cp $P/firepixel_64.png  "$ICONSET/icon_32x32@2x.png"
          cp $P/firepixel_128.png "$ICONSET/icon_128x128.png"
          cp $P/firepixel_256.png "$ICONSET/icon_128x128@2x.png"
          cp $P/firepixel_256.png "$ICONSET/icon_256x256.png"
          sips -z 512 512 $P/firepixel_256.png --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          sips -z 512 512 $P/firepixel_256.png --out "$ICONSET/icon_512x512.png" >/dev/null
          sips -z 1024 1024 $P/firepixel_256.png --out "$ICONSET/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/Firepixel.icns"

          # Manuals inside the bundle (the Help menu looks in Contents/Resources) and next to it
          cp docs/MANUAL.md docs/MANUAL.de.md "$APP/Contents/Resources/"
          cp docs/MANUAL.md docs/MANUAL.de.md LICENSE "$OUT/"
          cp LICENSE "$APP/Contents/Resources/"

          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Firepixel</string>
            <key>CFBundleDisplayName</key><string>Firepixel</string>
            <key>CFBundleIdentifier</key><string>app.firepixel</string>
            <key>CFBundleExecutable</key><string>firepixel</string>
            <key>CFBundleIconFile</key><string>Firepixel</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>LSMinimumSystemVersion</key><string>10.15</string>
            <key>LSArchitecturePriority</key>
            <array>
              <string>arm64</string>
              <string>x86_64</string>
            </array>
            <key>LSApplicationCategoryType</key><string>public.app-category.graphics-design</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSSupportsAutomaticGraphicsSwitching</key><true/>
          </dict>
          </plist>
          EOF
          sed -i '' -e 's/^          //' "$APP/Contents/Info.plist"
          plutil -lint "$APP/Contents/Info.plist"

          # Ad-hoc signing (no Apple ID; Gatekeeper requires right-click > Open on first launch)
          codesign --force -s - "$OUT/firepixel-cli"
          codesign --force --deep -s - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          file "$APP/Contents/MacOS/firepixel" "$OUT/firepixel-cli"

          # Quick CLI smoke test on the runner (runs the native arm64 slice)
          "$OUT/firepixel-cli" --version || true
          "$OUT/firepixel-cli" --help | head -n 20 || true

          cd dist
          ditto -c -k --sequesterRsrc --keepParent Firepixel-macOS-universal "Firepixel-macOS-universal-${VERSION}.zip"
          ls -la

      # The runner is Apple Silicon, so the probe only exercises the arm64 slice of the universal
      # binary; the x86_64 slice is checked by lipo/file above but never executed here.
      - name: Startup probe (GUI 20 s, screenshot)
        continue-on-error: true
        run: |
          set -u
          APP=dist/Firepixel-macOS-universal/Firepixel.app
          FP_STARTUP_TRACE=1 RUST_BACKTRACE=1 "$APP/Contents/MacOS/firepixel" > dist/start.log 2>&1 &
          PID=$!
          sleep 20
          screencapture -x dist/startprobe.png || true
          if kill -0 "$PID" 2>/dev/null; then
            echo "Firepixel still running after 20 s (PID $PID)"
            kill "$PID" || true
          else
            echo "::warning::Firepixel no longer running after 20 s"
            wait "$PID"; echo "Exit code: $?"
          fi
          cat dist/start.log | tail -n 60

      - uses: actions/upload-artifact@v4
        with:
          name: Firepixel-macOS-universal
          path: dist/Firepixel-macOS-universal-*.zip
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: startprobe
          path: |
            dist/startprobe.png
            dist/start.log
          if-no-files-found: ignore
          retention-days: 7

  tests:
    name: Tests (platform-neutral, batch and export crates)
    runs-on: macos-14
    timeout-minutes: 60
    # Only on request (input tests). A failing test (for example a golden hash that differs on this
    # OS, BA-083) fails the run; the artifact tests-macos holds a short summary and the log tail.
    # Native arm64 only (host target of the Apple Silicon runner), no universal build here.
    continue-on-error: false
    if: ${{ inputs.tests == true }}
    env:
      # Same as the Windows CI: tests never open a file manager or browser, no debug line tables
      FP_NO_SHELL_OPEN: "1"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2.8.0
        with:
          shared-key: macos-arm64-test
          cache-on-failure: true

      # No crate here opens a window (fp-ui is not included), so no Xvfb or graphics runtime is needed.
      # Text tests skip or fall back when the reference fonts are not installed (as on the Windows
      # runner). The batch/export crates carry the golden hashes (resampler, colour steps, background,
      # GIF optimizer, export).
      - name: cargo test
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          mkdir -p test-out
          PKGS="-p fp-model -p fp-geom -p fp-raster -p fp-vector -p fp-script"
          PKGS="$PKGS -p fp-batch -p fp-export -p fp-io -p fp-effects -p fp-color -p fp-fwpng -p fp-text -p fp-trace"
          cargo test --locked --no-fail-fast $PKGS 2>&1 | tee test-out/cargo-test.log

      # Short summary (result lines, failures, assertion messages, then the log tail) as an artifact
      # and on the run's summary page, so a hash mismatch is visible without the full log.
      - name: Test summary
        if: always()
        run: |
          LOG=test-out/cargo-test.log
          OUT=test-out/summary-macos.txt
          [ -f "$LOG" ] || { echo "no test log" > "$OUT"; exit 0; }
          {
            echo "== macos: $(uname -sm), commit $GITHUB_SHA"
            echo "== Result lines"
            grep -E '^ *Running |^test result:' "$LOG" || true
            echo "== Failures"
            grep -E ' FAILED$|^---- .* stdout ----$|panicked at|assertion|left:|right:|^error' "$LOG" | head -n 200 || true
            echo "== Last 150 lines"
            tail -n 150 "$LOG"
          } > "$OUT"
          {
            echo '### cargo test (macos)'
            echo '```'
            grep -E '^test result:| FAILED$|panicked at' "$LOG" | head -n 80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-macos
          path: |
            test-out/summary-macos.txt
            test-out/cargo-test.log
          if-no-files-found: ignore
          retention-days: 14
