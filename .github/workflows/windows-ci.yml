# Windows-CI: Pruefen, Tests (aufgeteilt) und Release-Build als Artifact.
# Wird auch vom Release-Workflow (prerelease.yml) per workflow_call aufgerufen; dann nur der
# Release-Build mit ZIP-Paket (Tests liefen schon beim Push auf main).
name: windows-ci

on:
  # Entscheidung A (Nutzer, 17.10.2026): keine Push-/PR-CI mehr (GitHub-Minuten), nur auf Abruf
  # (workflow_dispatch) und aus prerelease.yml (workflow_call).
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit/Branch, der gebaut wird"
        type: string
        required: true
      package:
        description: "ZIP-Paket fuer das Release erzeugen (ohne Tests)"
        type: boolean
        default: true

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Tests nie ins echte Profil, nichts im Explorer/Browser oeffnen
  FP_NO_SHELL_OPEN: "1"
  # CI: keine Zeilentabellen im Testbuild (schnelleres Linken; Optimierstufen wie lokal)
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  check:
    name: cargo check (warnungsfrei)
    if: ${{ !inputs.package }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@v2.8.0
        with:
          shared-key: win-check
          cache-on-failure: true
      - name: cargo check --workspace --all-targets
        shell: pwsh
        run: |
          cargo check --locked --workspace --all-targets --message-format short 2>&1 | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $w = $out | Where-Object { "$_" -match ': warning: ' }
          if ($w) { Write-Output "::error::$($w.Count) Warnung(en) bei cargo check"; exit 1 }

  test-core:
    name: Tests (ohne fp-ui)
    if: ${{ !inputs.package }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2.8.0
        with:
          shared-key: win-dev
          save-if: false
      # Ausgeklammert (--exact, volle Testnamen), weil dem Runner lokale Dateien fehlen; Liste auch in
      # docs/RELEASE.md:
      # - KI-Modelle (Modellordner leer): all_commands_work und repeated_commands_... rufen
      #   select.aiObject/aiSubject/aiRefineEdge auf.
      # - Muster aus dem lokal installierten Ressourcenordner (Muster "Cotton"): fixf::repeated_fill_...
      # - Schrift "Myriad Pro" nicht installiert (Ersatz Arial, andere Masse): tw02_textruns (3), tw_f4.
      - name: cargo test (alle Crates ausser fp-ui und der GUI-exe)
        run: >-
          cargo test --locked --workspace --exclude fp-ui --exclude firepixel --no-fail-fast --
          --exact
          --skip all_commands::all_commands_work
          --skip all_commands::repeated_commands_replace_instead_of_append
          --skip fixf::repeated_fill_same_kind_adds_no_step
          --skip default_values_like_original
          --skip face_is_postscript_name_for_family_names
          --skip text_runs_to_source_has_original_shape
          --skip text_pixel_rect_is_ink

  test-ui:
    name: Tests fp-ui (kittest)
    if: ${{ !inputs.package }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2.8.0
        with:
          shared-key: win-dev
          cache-on-failure: true
      # Ausgeklammert (--exact, volle Testnamen), weil dem Runner lokale Dateien fehlen; Liste auch in
      # docs/RELEASE.md:
      # - Texturen nur aus dem lokal installierten Ressourcenordner, auf dem Runner ist die
      #   Texturliste leer: fixd_ct2::texture_list_..., nz1::w21_texture_list_...
      # - ohne KI-Modelldatei zeigt der Inspektor statt des Hinweises "Modell fehlt":
      #   inspector_fv15::hg_ai_object_hint_names_exit_bitmap_mode
      - name: cargo test -p fp-ui
        run: >-
          cargo test --locked -p fp-ui --no-fail-fast --
          --exact
          --skip fixd_ct2::texture_list_as_wide_as_longest_name
          --skip nz1::w21_texture_list_as_wide_as_longest_name
          --skip inspector_fv15::hg_ai_object_hint_names_exit_bitmap_mode

  build:
    name: Release-Build (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2.8.0
        with:
          shared-key: win-release
          cache-on-failure: true
      - name: cargo build --release
        shell: pwsh
        run: |
          # CI-Artifact: parallel optimieren; das Release-ZIP (package) bleibt bei codegen-units = 1
          if ("${{ inputs.package }}" -ne "true") { $env:CARGO_PROFILE_RELEASE_CODEGEN_UNITS = "16" }
          cargo build --locked --release -p firepixel -p firepixel-cli
      - name: Paket zusammenstellen
        shell: pwsh
        run: |
          $ver = ((cargo pkgid -p firepixel) -replace '.*[#@]', '').Trim()
          $out = "dist/Firepixel-Windows-x64"
          New-Item -ItemType Directory -Force "$out/docs" | Out-Null
          Copy-Item target/release/firepixel.exe, target/release/firepixel-cli.exe, LICENSE $out
          Copy-Item docs/MANUAL.md, docs/MANUAL.de.md "$out/docs"
          & "$out/firepixel-cli.exe" --version
          if ("${{ inputs.package }}" -eq "true") {
            Compress-Archive -Path "$out/*" -DestinationPath "dist/Firepixel-Windows-x64-$ver.zip"
          }
          Get-ChildItem -Recurse dist | Select-Object FullName, Length
      - name: Artifact (CI)
        if: ${{ !inputs.package }}
        uses: actions/upload-artifact@v4
        with:
          name: Firepixel-Windows-x64
          path: dist/Firepixel-Windows-x64
          if-no-files-found: error
          retention-days: 7
      - name: Artifact (Release-ZIP)
        if: ${{ inputs.package }}
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/Firepixel-Windows-x64-*.zip
          if-no-files-found: error
          retention-days: 7
