# Windows CI: check, tests (split into two jobs) and a release build as an artifact.
# Also called by the release workflow (prerelease.yml) via workflow_call; in that case only the
# release build with the ZIP package runs (no check/test jobs).
name: windows-ci

on:
  # No push/PR CI (to save GitHub Actions minutes): on demand only (workflow_dispatch)
  # and from prerelease.yml (workflow_call).
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit or branch to build"
        type: string
        required: true
      package:
        description: "Create the release ZIP package (skips check and tests)"
        type: boolean
        default: true

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Tests never touch the real profile and never open Explorer or a browser
  FP_NO_SHELL_OPEN: "1"
  # CI: no debug line tables in test builds (faster linking; optimisation levels as locally)
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  check:
    name: cargo check (warning-free)
    if: ${{ !inputs.package }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@v2.8.0
        with:
          shared-key: win-check
          cache-on-failure: true
      - name: cargo check --workspace --all-targets
        shell: pwsh
        run: |
          cargo check --locked --workspace --all-targets --message-format short 2>&1 | Tee-Object -Variable out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $w = $out | Where-Object { "$_" -match ': warning: ' }
          if ($w) { Write-Output "::error::$($w.Count) warning(s) from cargo check"; exit 1 }

  test-core:
    name: Tests (without fp-ui)
    if: ${{ !inputs.package }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2.8.0
        with:
          shared-key: win-dev
          save-if: false
      # Skipped (--exact, full test names) because the runner lacks locally installed files; the list
      # is also in docs/RELEASE.md:
      # - AI models (model folder empty): all_commands_work and repeated_commands_... call
      #   select.aiObject/aiSubject/aiRefineEdge.
      # - Pattern from the locally installed resource folder (pattern "Cotton"): fixf::repeated_fill_...
      # - Font "Myriad Pro" not installed (Arial substituted, different metrics): tw02_textruns (3), tw_f4.
      - name: cargo test (all crates except fp-ui and the GUI exe)
        run: >-
          cargo test --locked --workspace --exclude fp-ui --exclude firepixel --no-fail-fast --
          --exact
          --skip all_commands::all_commands_work
          --skip all_commands::repeated_commands_replace_instead_of_append
          --skip fixf::repeated_fill_same_kind_adds_no_step
          --skip default_values_like_original
          --skip face_is_postscript_name_for_family_names
          --skip text_runs_to_source_has_original_shape
          --skip text_pixel_rect_is_ink

  test-ui:
    name: Tests fp-ui (kittest)
    if: ${{ !inputs.package }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2.8.0
        with:
          shared-key: win-dev
          cache-on-failure: true
      # Skipped (--exact, full test names) because the runner lacks locally installed files; the list
      # is also in docs/RELEASE.md:
      # - Textures come only from the locally installed resource folder, so the texture list is empty
      #   on the runner: fixd_ct2::texture_list_..., nz1::w21_texture_list_...
      # - Without an AI model file the inspector shows "Model missing" instead of the hint:
      #   inspector_fv15::hg_ai_object_hint_names_exit_bitmap_mode
      - name: cargo test -p fp-ui
        run: >-
          cargo test --locked -p fp-ui --no-fail-fast --
          --exact
          --skip fixd_ct2::texture_list_as_wide_as_longest_name
          --skip nz1::w21_texture_list_as_wide_as_longest_name
          --skip inspector_fv15::hg_ai_object_hint_names_exit_bitmap_mode

  build:
    name: Release build (x64)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2.8.0
        with:
          shared-key: win-release
          cache-on-failure: true
      - name: cargo build --release
        shell: pwsh
        run: |
          # CI artifact: optimise in parallel; the release ZIP (package) keeps codegen-units = 1
          if ("${{ inputs.package }}" -ne "true") { $env:CARGO_PROFILE_RELEASE_CODEGEN_UNITS = "16" }
          cargo build --locked --release -p firepixel -p firepixel-cli
      - name: Assemble package
        shell: pwsh
        run: |
          $ver = ((cargo pkgid -p firepixel) -replace '.*[#@]', '').Trim()
          $out = "dist/Firepixel-Windows-x64"
          New-Item -ItemType Directory -Force "$out/docs" | Out-Null
          Copy-Item target/release/firepixel.exe, target/release/firepixel-cli.exe, LICENSE $out
          Copy-Item docs/MANUAL.md, docs/MANUAL.de.md "$out/docs"
          & "$out/firepixel-cli.exe" --version
          if ("${{ inputs.package }}" -eq "true") {
            Compress-Archive -Path "$out/*" -DestinationPath "dist/Firepixel-Windows-x64-$ver.zip"
          }
          Get-ChildItem -Recurse dist | Select-Object FullName, Length
      - name: Artifact (CI)
        if: ${{ !inputs.package }}
        uses: actions/upload-artifact@v4
        with:
          name: Firepixel-Windows-x64
          path: dist/Firepixel-Windows-x64
          if-no-files-found: error
          retention-days: 7
      - name: Artifact (release ZIP)
        if: ${{ inputs.package }}
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/Firepixel-Windows-x64-*.zip
          if-no-files-found: error
          retention-days: 7
