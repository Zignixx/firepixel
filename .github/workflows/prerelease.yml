# Pre-release: bump the version (minor), build Windows x64, macOS universal and Linux x86_64, create
# a tag and a pre-release with both ZIPs, the Linux tar.gz and the AppImage. Manual only
# (workflow_dispatch); see docs/RELEASE.md.
name: prerelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.3.0); empty = latest version with minor + 1"
        type: string
        required: false
        default: ""

concurrency:
  group: prerelease
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Set version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.ver.outputs.version }}
      prev_tag: ${{ steps.ver.outputs.prev_tag }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Determine next version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          prev_tag=$(git tag -l 'v0.*.0' --sort=-v:refname | head -n 1)
          cargo_ver=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml | head -n 1)
          if [ -n "$prev_tag" ]; then base=${prev_tag#v}; else base=$cargo_ver; fi
          if [ -n "${INPUT_VERSION}" ]; then
            version=${INPUT_VERSION#v}
          else
            IFS=. read -r major minor _ <<< "$base"
            version="${major}.$((minor + 1)).0"
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '$version' (expected X.Y.Z)"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"; exit 1
          fi
          echo "Previous tag: ${prev_tag:-none}, Cargo.toml: $cargo_ver -> new: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$prev_tag" >> "$GITHUB_OUTPUT"

      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Set version in Cargo.toml/Cargo.lock and commit to main
        id: commit
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          sed -i '/^\[workspace.package\]/,/^\[/{s/^version *= *".*"/version = "'"$VERSION"'"/}' Cargo.toml
          cargo update --workspace
          git diff --stat
          changed=$(git diff --name-only | sort | tr '\n' ' ')
          if [ -n "$changed" ] && [ "$changed" != "Cargo.lock Cargo.toml " ]; then
            echo "::error::Unexpected changes: $changed"; exit 1
          fi
          if [ -n "$changed" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Version $VERSION [skip ci]"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64
    needs: version
    uses: ./.github/workflows/windows-ci.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
      package: true

  macos:
    name: macOS universal
    needs: version
    uses: ./.github/workflows/macos-preview.yml
    with:
      ref: ${{ needs.version.outputs.sha }}

  linux:
    name: Linux x86_64
    needs: version
    uses: ./.github/workflows/linux-build.yml
    with:
      ref: ${{ needs.version.outputs.sha }}
      package: true

  release:
    name: Tag and pre-release
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PREV: ${{ needs.version.outputs.prev_tag }}
        run: |
          set -euo pipefail
          ls -la dist
          # Only use the previous tag if it is part of the current history (older tags from a
          # rewritten history are ignored).
          if [ -n "$PREV" ] && ! git merge-base --is-ancestor "$PREV" HEAD 2>/dev/null; then
            echo "::warning::Previous tag $PREV is not an ancestor of HEAD; treating as initial release"
            PREV=""
          fi
          {
            echo "# Firepixel $VERSION (pre-release)"
            echo
            echo "This is a preview build, not a final release."
            echo
            echo "## Installation"
            echo
            echo "- **Windows x64:** unzip \`Firepixel-Windows-x64-$VERSION.zip\` and start \`firepixel.exe\`. No installer is needed."
            echo "- **macOS (Apple Silicon and Intel, macOS 10.15 or later):** unzip \`Firepixel-macOS-universal-$VERSION.zip\`. The app is ad-hoc signed and not notarised, so on first launch right-click \`Firepixel.app\` > **Open** and confirm (or run \`xattr -dr com.apple.quarantine Firepixel.app\`)."
            echo "- **Linux x86_64 (glibc 2.35 or later, e.g. Ubuntu 22.04 or Debian 12):** AppImage: \`chmod +x Firepixel-x86_64.AppImage\`, then run it. tar.gz: unpack \`Firepixel-Linux-x64-$VERSION.tar.gz\` and run \`./firepixel\` in the folder \`Firepixel-Linux-x64\`. Needs a Vulkan or OpenGL driver; runs on Wayland and X11. File dialogs use the XDG desktop portal."
            echo
            echo "The command-line tool \`firepixel-cli\` and the manuals (English and German) are included in all packages."
            echo
            if [ -n "$PREV" ]; then
              echo "## Changes since $PREV"
              echo
              git log "$PREV..HEAD" --no-merges --max-count=100 --pretty='- %s' \
                | grep -v -E '^- Version [0-9.]+ \[skip ci\]$' || true
              total=$(git rev-list --no-merges --count "$PREV..HEAD")
              if [ "$total" -gt 100 ]; then echo; echo "...and $((total - 100)) more commits."; fi
            else
              echo "## Changes"
              echo
              echo "Initial public pre-release."
            fi
          } > notes.md
          cat notes.md

      - name: Create tag and pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ needs.version.outputs.sha }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" dist/*.zip dist/*.tar.gz dist/*.AppImage \
            --target "$SHA" \
            --prerelease \
            --title "Firepixel $VERSION (pre-release)" \
            --notes-file notes.md
          gh release view "v$VERSION" --json url --jq .url
