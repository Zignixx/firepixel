name: Bug report
description: Crash, wrong result, broken file or other defect in Firepixel.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please write in English and do not name the reference application or its vendor
        (say "the reference application"). If Firepixel works but behaves differently from the reference
        application, use the **Parity gap** template instead.
  - type: input
    id: version
    attributes:
      label: Version
      description: Build name or commit (Help ▸ About), e.g. the date of a preview build.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Windows Server
        - macOS
        - Linux
        - other
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: UI language
      options:
        - English
        - German
        - other
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. File ▸ New, 800 × 600
        2. Select the Rectangle tool, drag from …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
      description: Error messages, crash dialog text, log output.
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots and files
      description: Attach screenshots or a small test document here (drag and drop). Only files you created yourself, never files taken from an installation of the reference application.
