[package]
name = "fp-vector"
description = "Vector rendering: path rasterizer, fills/gradients/patterns/textures, strokes/brushes, path operations (boolean operations, compound shapes, expand stroke, inset, simplify)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# Serialisierung der Eingabe-Strukturen (VectorPath, Fill, Stroke, BrushParams …).
serde = ["dep:serde", "fp-geom/serde", "fp-color/serde"]

[dependencies]
fp-geom = { workspace = true }
fp-color = { workspace = true }
fp-raster = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
png = { workspace = true }

[lints]
workspace = true
