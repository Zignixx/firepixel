[package]
name = "fp-text"
description = "Text des Originals: Schriftverwaltung zur Laufzeit, Satz (Punkttext, Rahmen, Pfad), Glyphen-Konturen, Rasterung mit Überabtastung und Tonkurven"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fp-i18n = { workspace = true }
fp-geom = { workspace = true, features = ["serde"] }
fp-color = { workspace = true, features = ["serde"] }
fp-raster = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
# crate-eigene Spezialfälle (reine Rust-Crates): Schriftdateien lesen und Shaping
ttf-parser = "0.25"
rustybuzz = "0.20"

[dev-dependencies]
serde_json = { workspace = true }
png = { workspace = true }

[lints]
workspace = true
