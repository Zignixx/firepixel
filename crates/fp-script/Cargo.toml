[package]
name = "fp-script"
description = "JSF compatibility for Firepixel: JSF JavaScript (fw, document DOM, Files, Errors) via boa_engine, mapped onto the fp-engine command registry"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Mehrsprachige Fehlermeldungen (Skriptfehler für die Oberfläche)
fp-i18n = { workspace = true }
fp-engine = { workspace = true }
fp-model = { workspace = true }
fp-geom = { workspace = true }
fp-color = { workspace = true }
fp-raster = { workspace = true }
fp-fwpng = { workspace = true }
fp-render = { workspace = true }
fp-io = { workspace = true, optional = true }
fp-export = { workspace = true, optional = true }
png = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# reine Rust-JS-Engine; ohne ICU/Temporal, mit Annex B (Altsyntax wie in SpiderMonkey 1.x)
boa_engine = { version = "0.22", default-features = false, features = ["annex-b"] }

[dev-dependencies]
# Tests mit Myriad-Pro-Metrik prüfen, ob die Schrift installiert ist
fp-text = { workspace = true }

[features]
default = ["formats"]
# Import fremder Formate (fp-io) und Export GIF/JPEG/WebP/AVIF/… (fp-export); ohne: nur FW-PNG/PNG
formats = ["dep:fp-io", "dep:fp-export"]

[lints]
workspace = true
