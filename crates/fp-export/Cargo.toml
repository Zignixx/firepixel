[package]
name = "fp-export"
description = "Export: optimize settings, palettes, quantizers, dithering, GIF/JPEG/PNG8/24/32, animation, slices, HTML/CSS/behaviours, PSD; plus WebP, AVIF, APNG"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
fp-geom = { workspace = true }
fp-color = { workspace = true }
fp-raster = { workspace = true }
fp-model = { workspace = true }
# text layout for invisible PDF text and PSD type layers (same layout as the renderer)
fp-text = { workspace = true }
fp-render = { workspace = true }
thiserror = { workspace = true }
# Mehrsprachige Fehlermeldungen
fp-i18n = { workspace = true }
flate2 = { workspace = true }
# eine PNG-Zeilenfilterregel für alle Schreibwege (libpng-Gleichstand, Q-37)
fp-fwpng = { workspace = true }
crc32fast = { workspace = true }
# crate-eigene Spezialfälle (reine Rust-Crates): JPEG-Dekodierung für die Vorschau
zune-jpeg = "0.5.15"
# WebP verlustbehaftet/verlustfrei/animiert: libwebp, über libwebp-sys statisch mit MSVC gebaut (keine DLL)
webp = { version = "=0.3.1", default-features = false }
# AVIF: rav1e ohne Assembler (reines Rust)
ravif = { version = "=0.13.0", default-features = false, features = ["threading"] }
# JPEG 2000 (/JPXDecode) in the PDF export: pure-Rust port of OpenJPEG, BSD-2-Clause, no C (BA-101);
# "file-io" = the only safe output stream of the crate (see src/jpx.rs)
openjp2 = { version = "=0.6.1", default-features = false, features = ["std", "file-io"] }

[dev-dependencies]
# independent JPEG 2000 decoder (the one fp-io's PDF import uses via hayro) to check the PDF image streams
hayro-jpeg2000 = { version = "=0.4.1", default-features = false, features = ["std", "simd"] }
png = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true