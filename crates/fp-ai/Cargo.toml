[package]
name = "fp-ai"
description = "AI selection for Firepixel: own pure-Rust CPU inference for object selection (SAM 2.1), select subject and refine edge (BiRefNet), model management with verified download"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
fp-geom = { workspace = true }
fp-raster = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# Mehrsprachige Fehlermeldungen
fp-i18n = { workspace = true }
rayon = { workspace = true }
# Matrixmultiplikation (reines Rust, SIMD zur Laufzeit gewählt, sichere API)
faer = { version = "0.24", default-features = false, features = ["std", "rayon"] }
# Prüfsumme der Modelldateien
sha2 = "0.10"

# Model download after consent. Windows: TLS through the system library (SChannel, no extra DLL).
[target.'cfg(windows)'.dependencies]
ureq = { version = "3", default-features = false, features = ["native-tls"] }

# Other platforms: rustls (ring, bundled webpki roots), so the Linux build does not link OpenSSL.
[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
png = { workspace = true }
# Testbilder (JPEG) lesen
fp-io = { workspace = true }

[lints]
workspace = true
