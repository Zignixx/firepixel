[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
# eigene Kopie von egui-wgpu (vendor\egui-wgpu, FV-8): nicht Teil des Workspace
exclude = ["vendor"]

[workspace.package]
version = "0.2.12"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Zignixx/firepixel"
rust-version = "1.95"

[workspace.dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "persistence"] }
egui = "0.36"
# gemeinsame Bibliotheken (neue nur über den Koordinator hier eintragen; crate-eigene Spezialfälle direkt im Crate)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
crc32fast = "1"
rayon = "1"
png = "0.18"
image = { version = "0.25", default-features = false }
log = "0.4"
# interne Crates
fp-geom = { path = "crates/fp-geom" }
fp-color = { path = "crates/fp-color" }
fp-raster = { path = "crates/fp-raster" }
fp-model = { path = "crates/fp-model" }
fp-fwpng = { path = "crates/fp-fwpng" }
fp-vector = { path = "crates/fp-vector" }
fp-text = { path = "crates/fp-text" }
fp-effects = { path = "crates/fp-effects" }
fp-render = { path = "crates/fp-render" }
fp-engine = { path = "crates/fp-engine" }
fp-io = { path = "crates/fp-io" }
fp-export = { path = "crates/fp-export" }
fp-ui = { path = "crates/fp-ui" }
fp-script = { path = "crates/fp-script" }
fp-mcp = { path = "crates/fp-mcp" }
fp-i18n = { path = "crates/fp-i18n" }
fp-trace = { path = "crates/fp-trace" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
opt-level = 1
# Platz sparen (C: ist knapp): nur Zeilentabellen für Backtraces, keine volle Debug-Info.
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.dev.package."*"]
opt-level = 2
debug = false

# KI-Inferenz (fp-ai) auch im Entwicklungsbuild optimiert, sonst ist sie um ein Vielfaches langsamer (Agent KI)
[profile.dev.package.fp-ai]
opt-level = 3

# FV-8: egui-wgpu 0.36.2 mit Texturabtastung per textureLoad fuer Software-Rasterer (Rechner ohne
# Grafikkarte, Fernsitzung: Tippen/Ziehen sonst 0,5-1 s verzoegert). Aenderungen in
# vendor\egui-wgpu\README.md beschrieben.
[patch.crates-io]
egui-wgpu = { path = "vendor/egui-wgpu" }
